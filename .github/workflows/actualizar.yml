name: Actualizar TCO

on:
  schedule:
    # Hora Bolivia = UTC-4. El BCB publica el corte ~20:00 (a veces con atraso):
    # cada 15 min de 19:30 a 23:45 hora Bolivia (23:30 a 03:45 UTC)
    - cron: "30,45 23 * * *"
    - cron: "*/15 0-3 * * *"
    # respaldo: 08:00 y 14:00 hora Bolivia
    - cron: "0 12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# una sola escritura de datos a la vez (compartido con "Paralelo Binance")
concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar datos del BCB
        run: node scripts/update.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos TCO $(TZ=America/La_Paz date +%F)"
            git pull --rebase
            git push
          fi
